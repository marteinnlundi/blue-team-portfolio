version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directories: [/tools/ioc-feed, /tools/caseboard]
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: gomod
    directories: [/tools/logpipe, /tools/ebpf-telemetry]
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /tools/ir-triage
    schedule: { interval: monthly }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: pip
    directories: [/tools/sigma-lite, /tools/auth-anom]
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: [/tools/caseboard, /demo]
    schedule: { interval: monthly }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logpipe:
    name: logpipe (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/logpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o logpipe ./cmd/logpipe

  python:
    name: sigma-lite + auth-anom (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ruff -r tools/sigma-lite/requirements-dev.txt -r tools/auth-anom/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate detection rules
        run: python tools/sigma-lite/main.py --validate
      - name: Test sigma-lite
        run: python -m pytest -q
        working-directory: tools/sigma-lite
      - name: Test auth-anom
        run: python -m pytest -q
        working-directory: tools/auth-anom

  node:
    name: ${{ matrix.tool }} (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [ioc-feed, caseboard]
    defaults:
      run:
        working-directory: tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/${{ matrix.tool }}/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  ir-triage:
    name: ir-triage (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ir-triage
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Smoke test
        run: |
          cargo run --quiet -- --output /tmp/triage
          python3 -c "import json; r = json.load(open('/tmp/triage/report.json')); assert r['processes'] and len(r['manifest']) == 6"

  ebpf-telemetry:
    name: ebpf-telemetry (C + Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ebpf-telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: tools/ebpf-telemetry/go.sum
      - name: Install clang and libbpf headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev
      - name: Compile eBPF object
        run: make bpf
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: make test
      - name: Build
        run: make build
      - name: Load into the runner kernel and capture a process start
        run: |
          sudo ./ebpf-telemetry > events.jsonl 2> stderr.log &
          sleep 3
          /bin/ls / > /dev/null
          sleep 2
          sudo pkill -INT -x ebpf-telemetry || true
          sleep 1
          cat stderr.log
          grep -q '"kind":"process_start"' events.jsonl

  integration:
    name: Full pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/ioc-feed/package-lock.json
      - name: Install Python dependencies
        run: pip install -r tools/sigma-lite/requirements-dev.txt
      - name: Build ioc-feed
        run: npm ci && npm run build
        working-directory: tools/ioc-feed
      - name: Run integration tests
        run: python -m pytest tests/integration -v

  demo:
    name: Docker Compose demo
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: demo/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Start caseboard
        run: docker compose up --build --detach --wait caseboard
      - name: Run the pipeline
        run: docker compose run --rm pipeline
      - name: Check that alerts and a case reached caseboard
        run: |
          curl -fsS http://127.0.0.1:3000/api/alerts | python3 -c "import json, sys; alerts = json.load(sys.stdin); print(len(alerts), 'alerts'); assert len(alerts) >= 30"
          curl -fsS http://127.0.0.1:3000/api/cases | python3 -c "import json, sys; cases = json.load(sys.stdin); print(len(cases), 'case(s)'); assert len(cases) == 1"
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  docs:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v25

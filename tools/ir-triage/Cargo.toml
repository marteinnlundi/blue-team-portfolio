[package]
name = "ir-triage"
version = "0.1.0"
edition = "2021"
description = "Host triage CLI — collect artifacts and produce an evidence bundle"
license-file = "../../LICENSE"
repository = "https://github.com/marteinnlundi/soc-in-a-box"
publish = false

[[bin]]
name = "ir-triage"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
